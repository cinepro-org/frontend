<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <meta content="CinePro Player" name="apple-mobile-web-app-title" />
        <meta content="#ffffff" name="theme-color" />
        <meta content="CinePro Player - Watch your favorite Shows and Movies!" name="description" />
        <meta content="CinePro Player" property="og:title" />
        <meta content="CinePro Player - Watch your favorite Shows and Movies!" property="og:description" />
        <meta content="website" property="og:type" />

        <title>CinePro Player</title>
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                height: 100%;
                font-family: Arial, sans-serif;
            }

            .message-container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #2d2d2d;
                color: white;
            }

            .message-container h1 {
                background-color: #e53e3e;
                padding: 20px 30px;
                border-radius: 8px;
                font-size: 24px;
                text-align: center;
                max-width: 80%;
                word-wrap: break-word;
                font-weight: 600;
            }

            @media (max-width: 600px) {
                .message-container h1 {
                    font-size: 20px;
                    padding: 15px;
                }
            }
        </style>
    </head>
    <body>
        <noscript>
            <div class="message-container">
                <h1>You need JavaScript to run this application.</h1>
            </div>
        </noscript>
        <div id="root"></div>
        <script src="/src/main.tsx" type="module"></script>
    </body>
</html>
